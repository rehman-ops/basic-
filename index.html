<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESTAURANT NAME HERE | Official Website</title>
    <meta
      name="description"
      content="RESTAURANT DESCRIPTION HERE"
    />
    <meta name="keywords" content="RESTAURANT NAME HERE, restaurant, menu, food, dining" />
    <meta name="author" content="RESTAURANT NAME HERE" />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph Meta Tags -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:title" content="RESTAURANT NAME HERE | Official Website" />
    <meta
      property="og:description"
      content="RESTAURANT DESCRIPTION HERE"
    />
    <meta property="og:site_name" content="RESTAURANT NAME HERE" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RESTAURANT NAME HERE | Official Website" />
    <meta
      name="twitter:description"
      content="RESTAURANT DESCRIPTION HERE"
    />

    <!-- Google Fonts: Cormorant Garamond (refined luxury serif) + Plus Jakarta Sans (clean geometric sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org LocalBusiness / Restaurant Structured Data Template -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "RESTAURANT NAME HERE",
      "description": "RESTAURANT DESCRIPTION HERE",
      "servesCuisine": ["CUISINE TYPE HERE"],
      "priceRange": "PRICE RANGE HERE",
      "telephone": "PHONE NUMBER HERE",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "RESTAURANT ADDRESS HERE",
        "addressLocality": "CITY HERE",
        "addressCountry": "COUNTRY HERE"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "00:00",
          "closes": "00:00"
        }
      ],
      "acceptsReservations": "False",
      "hasMenu": "#menu"
    }
    </script>
  </head>
  <body class="bg-[#0f0d0c] text-[#f2ece4] antialiased selection:bg-[#d97706]/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
